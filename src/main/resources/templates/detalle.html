
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="|${receta.nombre} - Recetas del Mundo|">
        Detalle de receta
    </title>

    <link rel="stylesheet"
          th:href="@{/css/estilos.css}">
</head>
<body>

<header class="header">
    <div class="logo">🍳 Recetas del Mundo</div>

    <nav>
        <a th:href="@{/recetas}">Inicio</a>
        <a th:href="@{/recetas/buscar}">
            Buscar recetas
        </a>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn-login">
                Cerrar sesión
            </button>
        </form>
    </nav>
</header>

<main class="contenido">

    <a th:href="@{/recetas/buscar}" class="volver">
        ← Volver a las recetas
    </a>

    <article class="detalle-receta">

        <h1 th:text="${receta.nombre}">
            Nombre de receta
        </h1>

        <div class="imagen-receta">

            <img th:if="${receta.fotografia != null
                         and !#strings.isEmpty(receta.fotografia)}"
                 th:src="${receta.fotografia}"
                 th:alt="|Fotografía de ${receta.nombre}|">

            <p th:unless="${receta.fotografia != null
                            and !#strings.isEmpty(receta.fotografia)}">
                Fotografía pendiente de incorporar
            </p>

        </div>

        <div class="datos-receta">
            <div>
                <strong>🌎 País de origen</strong>
                <p th:text="${receta.paisOrigen}"></p>
            </div>

            <div>
                <strong>🍽️ Tipo de cocina</strong>
                <p th:text="${receta.tipoCocina}"></p>
            </div>

            <div>
                <strong>⏱️ Tiempo de cocción</strong>
                <p th:text="|${receta.tiempoCoccionMin} minutos|"></p>
            </div>

            <div>
                <strong>⭐ Dificultad</strong>
                <p th:text="${receta.dificultad}"></p>
            </div>
        </div>

        <section class="seccion-receta">
            <h2>Ingredientes</h2>
            <p th:text="${receta.ingredientes}"></p>
        </section>

        <section class="seccion-receta">
            <h2>Instrucciones de preparación</h2>
            <p th:text="${receta.instrucciones}"></p>
        </section>

    </article>

</main>

<footer>
    <p>Recetas del Mundo - ISY2202</p>
</footer>

</body>
</html>
