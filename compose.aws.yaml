
name: recetas-aws

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: recetas_db
      MYSQL_USER: recetas_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - recetas_aws_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD" -e "SELECT 1"'
      interval: 10s
      timeout: 5s
      retries: 15

  app:
    build: .
    image: recetas-semana2:aws
    restart: unless-stopped

    ports:
      - "80:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/recetas_db
      SPRING_DATASOURCE_USERNAME: recetas_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      APP_USUARIO1_PASSWORD: ${APP_USUARIO1_PASSWORD}
      APP_USUARIO2_PASSWORD: ${APP_USUARIO2_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  recetas_aws_mysql_data:
